schema_version = 1
name = "OpenBuild defaults"
writer_policy = "single"
failure_policy = "block"

[discovery.default]
agents = ["openbuild_search_separate"]
max_steps = 1
escalation_mode = "after-evidence"
escalation_triggers = ["insufficient-evidence", "ambiguous-ownership", "cross-file-gap"]
stop_on_success = true
transport_failure = "block"
fallback = "targeted-root"
critical_confirmed = false

[critic.low]
agents = ["openbuild_review_fast", "openbuild_review_balanced"]
max_steps = 2
escalation_mode = "after-evidence"
escalation_triggers = ["coverage-gap", "unresolved-contradiction", "low-confidence", "material-uncertainty"]
stop_on_success = true
transport_failure = "block"
fallback = "block"
critical_confirmed = false

[critic.medium]
agents = ["openbuild_review_balanced", "openbuild_review_strong"]
max_steps = 2
escalation_mode = "after-evidence"
escalation_triggers = ["coverage-gap", "unresolved-contradiction", "low-confidence", "material-uncertainty"]
stop_on_success = true
transport_failure = "block"
fallback = "block"
critical_confirmed = false

[critic.high]
