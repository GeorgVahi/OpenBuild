  <text x="575" y="484" class="tiny muted">Terra · medium</text>

  <rect x="550" y="650" width="255" height="105" class="box blue"/>
  <text x="575" y="683" class="small" fill="#8fc9ff">CRITICAL</text>
  <text x="575" y="711" class="small">implementation_strongest</text>
  <text x="575" y="737" class="tiny muted">Sol · xhigh</text>

  <rect x="842" y="397" width="207" height="105" class="box yellow"/>
  <text x="945" y="429" text-anchor="middle" class="small" fill="#ffe34d">NEEDS_ESCALATION</text>
  <text x="945" y="456" text-anchor="middle" class="small" fill="#ffe34d">before edits</text>
  <text x="945" y="482" text-anchor="middle" class="tiny muted">completed + zero writes</text>
  <path d="M805 449 H842" class="line"/>

  <rect x="842" y="535" width="207" height="105" class="box blue"/>
  <text x="945" y="568" text-anchor="middle" class="small" fill="#8fc9ff">ONE TIER ONLY</text>
  <text x="945" y="595" text-anchor="middle" class="small">implementation_strong</text>
  <text x="945" y="621" text-anchor="middle" class="tiny muted">Sol · high</text>
  <path d="M945 502 V535" class="line"/>

  <rect x="842" y="674" width="207" height="74" class="box blue"/>
  <text x="945" y="705" text-anchor="middle" class="small">Exact dispatch receipt</text>
  <text x="945" y="732" text-anchor="middle" class="tiny muted">lease · model · effort</text>
  <path d="M805 324 H1022 V674" class="line"/>
  <path d="M805 702 H842" class="line"/>
  <path d="M945 640 V674" class="line"/>

