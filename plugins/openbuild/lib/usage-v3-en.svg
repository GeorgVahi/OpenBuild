  <path d="M1340 538 V585" class="line"/>

  <rect x="1140" y="585" width="400" height="105" class="box purple"/>
  <text x="1340" y="619" text-anchor="middle" class="body">Finding → root remediation</text>
  <text x="1340" y="650" text-anchor="middle" class="body">→ green validation</text>
  <text x="1340" y="677" text-anchor="middle" class="tiny muted">reviewer never edits</text>
  <path d="M1340 690 V727" class="line"/>

  <rect x="1140" y="727" width="400" height="105" class="box purple"/>
  <text x="1340" y="761" text-anchor="middle" class="body">Next proven tier only</text>
  <text x="1340" y="790" text-anchor="middle" class="small" fill="#dda2ff">strong · Sol high</text>
  <text x="1340" y="817" text-anchor="middle" class="tiny muted">strongest only for final dispute</text>
  <text x="1340" y="868" text-anchor="middle" class="small" fill="#dda2ff">Clean balanced review may close high risk</text>

  <rect x="570" y="925" width="460" height="55" class="box green" fill="#071808" filter="url(#glow)"/>
  <text x="800" y="960" text-anchor="middle" class="label" fill="#62ff72">✓  VERIFIED COMPLETION</text>
</svg>
