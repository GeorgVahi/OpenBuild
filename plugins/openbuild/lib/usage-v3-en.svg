  <text x="363" y="718" text-anchor="middle" class="body">Targeted root</text>
  <text x="363" y="747" text-anchor="middle" class="body">recovery</text>
  <text x="363" y="775" text-anchor="middle" class="tiny muted">minimum lookup only</text>
  <path d="M253 736 H269" class="line"/>
  <text x="258" y="846" text-anchor="middle" class="small" fill="#6ff8ff">Spark remains fixed for code discovery</text>

  <text x="551" y="260" class="small muted">STARTING ROUTE</text>
  <rect x="550" y="278" width="255" height="92" class="box blue"/>
  <text x="575" y="310" class="small" fill="#8fc9ff">LOW</text>
  <text x="575" y="338" class="body">implementation_fast</text>
  <text x="575" y="360" class="tiny muted">Terra · low</text>

