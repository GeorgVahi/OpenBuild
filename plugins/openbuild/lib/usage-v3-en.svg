<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03070c"/>
      <stop offset="1" stop-color="#09050f"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#eaf2ff"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #f4f7fb; }
      .muted { fill: #aab7c7; }
      .tiny { font-size: 15px; }
      .small { font-size: 18px; }
      .body { font-size: 21px; }
      .label { font-size: 24px; font-weight: 650; }
      .title { font-size: 35px; font-weight: 720; }
      .line { fill: none; stroke: #eaf2ff; stroke-width: 2.5; marker-end: url(#arrow); }
      .cyan { stroke: #00e8f2; }
      .blue { stroke: #1688ff; }
      .purple { stroke: #c65cff; }
      .yellow { stroke: #ffd400; }
      .green { stroke: #36ef4b; }
      .box { fill: #07111b; stroke-width: 2; rx: 16; }
      .panel { fill: #050a10; fill-opacity: .82; stroke-width: 2; rx: 22; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="800" y="55" text-anchor="middle" class="title">OpenBuild 2.1.4 · weaker-first exact routing</text>
  <rect x="570" y="78" width="460" height="62" class="box yellow" fill="#1a1502"/>
  <text x="800" y="117" text-anchor="middle" class="label" fill="#ffe34d">TASK RISK + RUNTIME EVIDENCE</text>

  <rect x="24" y="170" width="468" height="730" class="panel cyan"/>
  <rect x="516" y="170" width="568" height="730" class="panel blue"/>
  <rect x="1108" y="170" width="468" height="730" class="panel purple"/>

  <text x="55" y="216" class="label" fill="#00e8f2">⌕  SEARCH · READ-ONLY</text>
  <text x="547" y="216" class="label" fill="#1688ff">⚙  IMPLEMENTATION · ONE WRITER</text>
  <text x="1139" y="216" class="label" fill="#c65cff">◉  REVIEW · READ-ONLY</text>

  <rect x="58" y="252" width="400" height="88" class="box cyan"/>
  <text x="258" y="285" text-anchor="middle" class="body">Compact evidence plan</text>
  <text x="258" y="315" text-anchor="middle" class="small muted">path:line · symbol · why it matters</text>
  <path d="M258 340 V382" class="line"/>

  <rect x="58" y="382" width="400" height="110" class="box cyan"/>
  <text x="258" y="418" text-anchor="middle" class="small muted">EXACT SEPARATE PROCESS</text>
  <text x="258" y="452" text-anchor="middle" class="body">openbuild_search_separate</text>
  <text x="258" y="478" text-anchor="middle" class="small" fill="#6ff8ff">Spark · low · read-only</text>
  <path d="M258 492 V535" class="line"/>

  <rect x="58" y="535" width="400" height="88" class="box cyan"/>
  <text x="258" y="570" text-anchor="middle" class="body">Routing receipt before search</text>
  <text x="258" y="599" text-anchor="middle" class="small muted">model + effort + process evidence</text>

